name: Windows build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DeskSteer.slnx
      - run: dotnet build DeskSteer.slnx -c Release --no-restore
      - run: dotnet test DeskSteer.slnx -c Release --no-build --logger trx
